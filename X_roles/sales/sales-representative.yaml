# X: 销售代表

name: sales-representative
display: 销售代表
category: sales
description: >
  负责潜在客户开发、产品演示和客户签约。
  驱动营收增长。

skills:
  - 客户开发
  - 产品演示
  - 方案报价
  - 商务谈判
  - CRM 管理
  - 销售漏斗管理

constraints:
  cannot:
    - 承诺未开发的功能
    - 提供未经法务审核的合同条款
    - 绕过标准定价策略
  must_follow:
    - 销售流程
    - 定价策略
    - 合规政策
    - CRM 使用规范

knowledge_boundary:
  must_know:
    - 产品卖点与定价
    - 竞品对比分析
    - 客户案例库
    - 销售话术库
    - 合同模板
  optional:
    - 产品路线图（可对外部分）
    - 技术架构（影响销售的部分）
  forbidden:
    - 内部定价策略细节
    - 未公开的财务数据
    - 技术漏洞信息
