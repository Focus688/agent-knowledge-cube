<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0.08" />
    </linearGradient>
    <linearGradient id="sliceColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:0.3" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="720" fill="#FAFBFC"/>
  
  <!-- Title -->
  <text x="500" y="50" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">🧊 Agent Knowledge Cube</text>
  <text x="500" y="75" text-anchor="middle" font-size="15" fill="#6B7280">三维知识约束框架 — 用结构代替 prompt，从源头约束 AI Agent</text>

  <!-- ========== LEFT: The Cube ========== -->
  
  <!-- Cube isometric: center at (280, 380), size 150 -->
  
  <!-- Cube Top Face (YZ plane) -->
  <polygon points="280,240 430,290 280,340 130,290" fill="url(#cubeTop)" stroke="#3B82F6" stroke-width="2"/>
  
  <!-- Cube Left Face (XY plane) -->
  <polygon points="130,290 280,340 280,490 130,440" fill="url(#cubeLeft)" stroke="#3B82F6" stroke-width="2"/>
  
  <!-- Cube Right Face (XZ plane) -->
  <polygon points="280,340 430,290 430,440 280,490" fill="url(#cubeRight)" stroke="#3B82F6" stroke-width="2"/>

  <!-- Highlighted Knowledge Slice at (x, y) -->
  <polygon points="230,310 310,340 310,390 230,360" fill="url(#sliceColor)" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,3"/>
  
  <!-- Point marker inside slice -->
  <circle cx="270" cy="350" r="5" fill="#F59E0B" stroke="#fff" stroke-width="2"/>
  <text x="275" y="345" font-size="11" font-weight="700" fill="#92400E">(x, y, z)</text>

  <!-- X Axis Label -->
  <line x1="100" y1="500" x2="460" y2="500" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="460" y="505" font-size="15" font-weight="700" fill="#1F2937">X — 角色（谁做）</text>
  <text x="460" y="522" font-size="12" fill="#9CA3AF">Engineer / Sales / Support / PM ...</text>

  <!-- Y Axis Label -->
  <line x1="80" y1="460" x2="80" y2="230" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="75" y="225" text-anchor="end" font-size="15" font-weight="700" fill="#1F2937">Y — 工作流（怎么做）</text>
  <text x="75" y="208" text-anchor="end" font-size="12" fill="#9CA3AF">营销 → 研发 → 生产 → 交付</text>

  <!-- Z Axis Label -->
  <line x1="130" y1="295" x2="455" y2="195" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="460" y="195" font-size="15" font-weight="700" fill="#1F2937">Z — 知识库（用什么做）</text>
  <text x="460" y="212" font-size="12" fill="#9CA3AF">代码规范 / 销售话术 / FAQ ...</text>

  <!-- ========== RIGHT: Comparisons ========== -->
  
  <!-- Before Card -->
  <rect x="560" y="100" width="400" height="130" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="580" y="128" font-size="11" fill="#EF4444" font-weight="700">✗ 传统方式 — Prompt 软约束</text>
  <text x="580" y="150" font-size="13" fill="#1F2937">"你是一个客服，不要管定价的事"</text>
  <text x="580" y="170" font-size="13" fill="#1F2937">"你是一个工程师，不要碰销售数据"</text>
  <rect x="580" y="182" width="360" height="1" fill="#FECACA"/>
  <text x="580" y="200" font-size="12" fill="#DC2626">❌ Agent 还是会看到全部知识，全靠自律</text>
  <text x="580" y="218" font-size="12" fill="#DC2626">❌ 容易越界、互相矛盾、烧 token</text>

  <!-- After Card -->
  <rect x="560" y="255" width="400" height="130" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="580" y="283" font-size="11" fill="#16A34A" font-weight="700">✓ Cube 方式 — 结构硬约束</text>
  <text x="580" y="305" font-size="13" fill="#1F2937">客服 Agent → 只看 FAQ + 工单模板</text>
  <text x="580" y="325" font-size="13" fill="#1F2937">工程师 Agent → 只看代码规范 + 架构文档</text>
  <rect x="580" y="337" width="360" height="1" fill="#BBF7D0"/>
  <text x="580" y="355" font-size="12" fill="#16A34A">✅ Agent 根本看不到不属于自己的知识</text>
  <text x="580" y="373" font-size="12" fill="#16A34A">✅ 零冲突、精准投喂、省 60-80% token</text>

  <!-- Analogy Cards -->
  <text x="560" y="425" font-size="15" font-weight="700" fill="#1F2937">举个栗子 🌰</text>

  <!-- Analogy 1: Kitchen -->
  <rect x="560" y="440" width="190" height="120" rx="10" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="575" y="465" font-size="13" font-weight="700" fill="#9A3412">🍳 后厨</text>
  <text x="575" y="485" font-size="11" fill="#431407">掌勺的只知道盐在哪</text>
  <text x="575" y="502" font-size="11" fill="#431407">看不到收银台有多少钱</text>
  <text x="575" y="519" font-size="11" fill="#431407">不是自觉——</text>
  <text x="575" y="536" font-size="11" font-weight="700" fill="#9A3412">是工作台就没这玩意儿</text>

  <!-- Analogy 2: Factory -->
  <rect x="770" y="440" width="190" height="120" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="785" y="465" font-size="13" font-weight="700" fill="#1E3A5F">🏭 流水线</text>
  <text x="785" y="485" font-size="11" fill="#1E3A5F">装轮胎的不会去拿发动机</text>
  <text x="785" y="502" font-size="11" fill="#1E3A5F">没到他那一站</text>
  <text x="785" y="519" font-size="11" fill="#1E3A5F">不是品德高尚——</text>
  <text x="785" y="536" font-size="11" font-weight="700" fill="#1E3A5F">是传送带没传过去</text>

  <!-- Analogy 3: Library -->
  <rect x="560" y="575" width="190" height="120" rx="10" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="575" y="600" font-size="13" font-weight="700" fill="#4C1D95">📚 图书馆</text>
  <text x="575" y="620" font-size="11" fill="#2D1B69">学生的卡刷不进教授阅览室</text>
  <text x="575" y="637" font-size="11" fill="#2D1B69">不是贴条说"请勿入内"</text>
  <text x="575" y="654" font-size="11" fill="#2D1B69">不是自觉——</text>
  <text x="575" y="671" font-size="11" font-weight="700" fill="#4C1D95">是刷卡机直接拒绝</text>

  <!-- Final tagline -->
  <rect x="770" y="575" width="190" height="120" rx="10" fill="url(#cubeTop)" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="865" y="608" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">一句话</text>
  <text x="865" y="635" text-anchor="middle" font-size="12" fill="#1E3A5F">以前管 AI 靠"跟它说别乱看"</text>
  <text x="865" y="655" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">你的框架靠</text>
  <text x="865" y="675" text-anchor="middle" font-size="14" font-weight="700" fill="#1D4ED8">"它根本看不到"</text>
</svg>
