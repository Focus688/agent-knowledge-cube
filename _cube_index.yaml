# Agent Knowledge Cube — 三维索引矩阵
# _cube_index.yaml
#
# 每个条目定义了：
#   x: 角色 (Role)        — 谁做
#   y: 工作流阶段 (Stage) — 怎么做
#   z: 知识切片 (Slice)   — 用什么做
#
# Agent 启动时只加载与其 (x, y) 坐标匹配的知识切片
# 确保信息边界精准、角色不冲突

version: 1.0

cube:
  # ═══════════════════════════════════════════
  # 软件开发工作流
  # ═══════════════════════════════════════════

  # 需求分析阶段
  - x: product-manager
    y: software-development:requirements-analysis
    z:
      - product/user-research-guide.md
      - product/prd-template.md
      - product/competitor-analysis.md

  - x: data-analyst
    y: software-development:requirements-analysis
    z:
      - product/user-research-guide.md
      - product/metrics-definitions.md

  # 设计阶段
  - x: product-designer
